# pair.conf — Digital Sommelier Nginx configuration
# Deploy to: /etc/nginx/conf.d/pair.conf
# Apply: nginx -t && nginx -s reload

server {
    listen 443 ssl;
    server_name pair.julianli.net;
    ssl_certificate     /etc/letsencrypt/live/julianli.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/julianli.net/privkey.pem;

    root /www/wwwroot/barpair;
    index index.html;

    # API proxy — same process as Cake & Co., new prefix
    location /bar-api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # Auth endpoint (reuses Cake & Co. login)
    location /cake-api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Exported PDFs
    location /exports/ {
        alias /www/wwwroot/julianli/exports/;
        expires 7d;
    }

    # Serve uploaded images
    location /img/ {
        alias /www/wwwroot/julianli/img/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA service worker
    location ~ ^/(manifest\.json|sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header Service-Worker-Allowed "/";
    }
}

# HTTP → HTTPS redirect
server {
    if ($host = pair.julianli.net) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name pair.julianli.net;
    return 301 https://$host$request_uri;
}
