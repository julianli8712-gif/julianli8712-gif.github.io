<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cake &amp; Co. 汀·作</title>
<style>
  :root { --cream: #FFF9F0; --cocoa: #3C2415; --gold: #C8A45C; --gold-lt: rgba(200,164,92,0.15); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @keyframes foilShimmer { 0%,100% { opacity: 0.7 } 50% { opacity: 1; filter: brightness(1.15) } }

  body {
    font-family: Georgia, "Noto Serif SC", "STSong", serif;
    background: var(--cream);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 24px;
    background-image: radial-gradient(circle, rgba(200,164,92,0.06) 1px, transparent 1px);
    background-size: 32px 32px;
  }

  .card {
    background: #FFFDF9;
    border-radius: 12px;
    padding: 56px 44px 40px;
    text-align: center;
    box-shadow: 0 2px 24px rgba(60,36,21,0.06);
    max-width: 400px;
    border: 1px solid var(--gold-lt);
  }

  .brand-mark {
    position: relative; display: inline-block; margin-bottom: 28px; width: 72px; height: 72px;
  }
  .brand-mark .r1, .brand-mark .r2, .brand-mark .r3 {
    position: absolute; border-radius: 50%;
    top: 50%; left: 50%; transform: translate(-50%,-50%);
  }
  .brand-mark .r1 { width: 72px; height: 72px; background: rgba(200,164,92,0.06); }
  .brand-mark .r2 { width: 52px; height: 52px; background: rgba(200,164,92,0.12); }
  .brand-mark .r3 { width: 28px; height: 28px;
    background: linear-gradient(135deg, #E8D080 0%, #C8A45C 30%, #B8922E 60%, #C8A45C 100%);
    box-shadow: 0 2px 10px rgba(200,164,92,0.4), inset 0 1px 2px rgba(255,255,255,0.5);
    animation: foilShimmer 3s ease-in-out infinite;
  }

  h1 {
    font-family: Georgia, serif;
    font-size: 22px; letter-spacing: 3px; color: var(--cocoa);
    margin-bottom: 2px;
    text-shadow: 0 1px 1px rgba(200,164,92,0.15), 0 -1px 0 rgba(255,255,255,0.4);
  }
  .cn-box { display: flex; align-items: baseline; justify-content: center; gap: 4px; margin-bottom: 28px; }
  .cn-box span { font-family: "Noto Serif SC", serif; font-size: 14px; letter-spacing: 5px; color: var(--cocoa); }
  .cn-dot { width: 4px; height: 4px; border-radius: 50%; background: linear-gradient(135deg, #E8D080, #C8A45C, #B8922E); box-shadow: 0 1px 2px rgba(200,164,92,0.4); }

  .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; }
  .divider .line { flex: 1; height: 1px; background: rgba(200,164,92,0.2); }
  .divider .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); opacity: 0.5; flex-shrink: 0; }

  #qrcode {
    display: inline-block; padding: 14px;
    background: white; border-radius: 8px;
    border: 1px solid var(--gold-lt);
  }

  .url { font-family: Georgia, serif; font-size: 13px; color: rgba(60,36,21,0.5); letter-spacing: 1px; margin-top: 12px; }
  .tagline { font-family: "Noto Serif SC", serif; font-size: 12px; color: rgba(60,36,21,0.4); letter-spacing: 2px; }
  .tagline span { color: var(--gold); }

  @media print {
    body { background: white; background-image: none; }
    .card { box-shadow: none; border: 1px solid rgba(200,164,92,0.3); }
    @page { margin: 0; }
  }
</style>
</head>
