# Cake & Co. Nginx Configuration (reference copy)
# Production path: /etc/nginx/conf.d/cakeandco.conf
# Apply: nginx -t && nginx -s reload

server {
    listen 443 ssl;
    server_name cakeandco.julianli.net;
    ssl_certificate /etc/letsencrypt/live/julianli.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/julianli.net/privkey.pem;

    root /www/wwwroot/cakeandco;
    index index.html;

    # API proxy
    location /cake-api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # Static images (AI generated + admin uploads)
    # Must be BEFORE the SPA location / block
    location /img/ {
        alias /www/wwwroot/julianli/img/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all non-matching paths → index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public";
    }

    # PWA service worker files
    location ~ ^/(manifest\.json|sw\.js|workbox-.*\.js)$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header Service-Worker-Allowed "/";
    }
}

server {
    if ($host = cakeandco.julianli.net) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name cakeandco.julianli.net;
    return 301 https://$host$request_uri;
}
